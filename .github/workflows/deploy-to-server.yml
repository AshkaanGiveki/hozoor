name: Deploy to production server
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SERVER_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n ""
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer " \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AshkaanGiveki/server-deploy/actions/workflows/deploy-hozoor.yml/dispatches \
            -d '{"ref":"main"}'